name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OTP release report its own result instead of cancelling
      # the remaining jobs as soon as one of them fails.
      fail-fast: false
      matrix:
        # Each OTP release is paired with the newest rebar3 release that
        # supports it: 3.24 is the last one for OTP 25, 3.25 the last one
        # for OTP 26, and 3.28 covers OTP 27 and later.
        #
        # OTP 29 is not listed yet: the test dependency meck 0.9.2 does not
        # compile there (its bare `catch` is deprecated in OTP 29), and the
        # meck releases that do compile dropped OTP 25.
        #
        # ubuntu-latest resolves to Ubuntu 26.04, for which no OTP 25 builds
        # are published (erlef/setup-beam supports OTP 26+ there and 24.3+ on
        # ubuntu-24.04), so the OTP 25 job runs on ubuntu-24.04.
        include:
          - otp: '25'
            rebar3: '3.24'
            os: ubuntu-24.04
          - otp: '26'
            rebar3: '3.25'
            os: ubuntu-latest
          - otp: '27'
            rebar3: '3.28'
            os: ubuntu-latest
          - otp: '28'
            rebar3: '3.28'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-rebar3-${{ matrix.rebar3 }}-build-${{ hashFiles('rebar.config') }}
          restore-keys: ${{ runner.os }}-otp-${{ matrix.otp }}-rebar3-${{ matrix.rebar3 }}-build-

      - name: Compile
        run: rebar3 compile

      - name: Run tests
        run: rebar3 ct

      - name: Run dialyzer
        run: rebar3 dialyzer

      - name: Run xref
        run: rebar3 xref

  release:
    name: Tag and release
    needs: test
    # Only a push to the default branch can create a release: pull requests
    # and tag pushes skip this job.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version="$(sed -nE 's/.*\{vsn, *"([^"]+)".*/\1/p' src/ipdata.app.src | head -1)"
          if [ -z "$version" ]; then
            echo "::error file=src/ipdata.app.src::no vsn found"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create the tag and the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # git ls-remote --exit-code exits with 2 when the tag does not exist.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || status=$?
          case "$status" in
            0)
              echo "Tag $TAG already exists; nothing to release."
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            2)
              ;;
            *)
              echo "::error::git ls-remote failed with status $status"
              exit "$status"
              ;;
          esac
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to Hex.pm
    needs: [test, release]
    # A tag created by the release job with the workflow's own token does not
    # start another run, so the package is published here, in the same run.
    # A tag pushed by hand is published too; the release job is skipped then,
    # which is why the condition does not rely on the implicit success().
    if: >-
      ${{ !cancelled() && needs.test.result == 'success' &&
          (needs.release.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.28'

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-otp-27-rebar3-3.28-build-${{ hashFiles('rebar.config') }}
          restore-keys: ${{ runner.os }}-otp-27-rebar3-3.28-build-

      - name: Publish to Hex.pm
        run: rebar3 hex publish --repo hexpm --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Generate and publish docs
        run: rebar3 hex publish docs --repo hexpm --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
